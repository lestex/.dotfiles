name: linux ci

on:
  pull_request:
    paths:
    - 'scripts/linux-*'
    - '.config/**'

# a new push to the same PR cancels the run still in flight
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - name: Run script
      run: make
