name: mac CI

on:
  pull_request:
    paths:
    - 'scripts/mac-setup'
    - 'scripts/common'
    - 'install/**'
    - 'local/**'
    - 'tests/**'
    - '.config/**'
    - 'Makefile'
    - 'bin/**'
    - '.github/workflows/mac.yaml'

# a new push to the same PR cancels the run still in flight
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v5

    - name: Run script
      run: make

    # make installs the theme engine pinned in scripts/common; test theme-switcher
    # against it, so a pin bump that breaks the engine interface fails here.
    - name: Test theme-switcher
      run: bash tests/theme-switcher-test.sh
      env:
        THEME_SWITCHER_TEST_REQUIRE_ENGINE: "1"
