name: mac CI

on:
  pull_request:
    paths:
    - 'scripts/**'
    - 'local/**'
    - 'tests/**'
    - '.config/**'
    - 'install.sh'
    - '.github/workflows/mac.yaml'

# a new push to the same PR cancels the run still in flight
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v5

    - name: Run installer
      run: ./install.sh

    # The installer fetches the theme engine pinned in scripts/common; test theme-switcher
    # against it, so a pin bump that breaks the engine interface fails here.
    - name: Run tests
      run: for t in tests/*-test.sh; do echo "== $t"; bash "$t"; done
      env:
        THEME_SWITCHER_TEST_REQUIRE_ENGINE: "1"
