# set the terminals
set-option -g default-terminal "tmux-256color"
# Truecolor, so the theme's exact colors work (theme-switcher sets window-style
# and cursor-colour from the palette as hex)
set -ag terminal-overrides ",*:RGB"

# very large history
set -g history-limit 1000000

# Reload config file with prefix+r
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "~/.config/tmux/tmux.conf reloaded"

# base settings
set -g focus-events on
set -g status-keys vi

# window settings
setw -g mode-keys vi
set -g set-clipboard on

# congigure tmux with claude
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
# Pass Shift+Enter and friends on as CSI-u, the form the terminals send them in
set -g extended-keys-format csi-u

# start windows and pane numbering with index 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# re-number windows when one is closed
set -g renumber-windows on

# remove confirm step when killing a window or pane
bind-key & kill-window
bind-key x kill-pane

# begin selection with `v` (vi-like)
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection

# Mouse bindings
set -g mouse on

# Theme. Only ANSI color names (blue, magenta, brightblack, ...), never hex:
# they resolve through the terminal's palette, so the status bar and borders
# follow `theme-switcher set <name>` without reloading this file.
set -g status-position top
set -g status-style "bg=default,fg=white"
set -g pane-active-border-style "fg=brightyellow,bg=default"
set -g pane-border-style "fg=white,bg=default"

set -g status-left-length 30
set -g status-left "#[fg=blue,bold,bg=default][#S] " # session name

set -g window-status-format "#[fg=brightblack,bg=default][#[fg=white,bg=default]#I #F #W#[fg=brightblack,bg=default]]"
set -g window-status-current-format "#[fg=brightblack,bg=default][#[fg=magenta,bold,bg=default]#I #F #W#[fg=brightblack,nobold,bg=default]]"

set -g status-right-length 1
set -g status-right " "
