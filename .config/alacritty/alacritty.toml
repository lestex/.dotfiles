[cursor]
style = "Block"
unfocused_hollow = true

[env]
TERM = "xterm-256color"

# Font family and size come from the font-switcher import below.
[font.offset]
x = 0
y = 0

[[hints.enabled]]
command = "open"
hyperlinks = true
post_processing = true
persist = false
mouse.enabled = true
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩`]+"

[[keyboard.bindings]]
action = "DecreaseFontSize"
key = "Minus"
mods = "Command"

[[keyboard.bindings]]
action = "IncreaseFontSize"
key = "Equals"
mods = "Command"

# move cursor one word right
[[keyboard.bindings]]
chars = "\u001BF"
key = "Right"
mods = "Alt"

# move cursor one word left
[[keyboard.bindings]]
chars = "\u001BB"
key = "Left"
mods = "Alt"

# move cursor to the beginning
[[keyboard.bindings]]
chars = "\u001BOH"
key = "Left"
mode = "AppCursor"
mods = "Command"

# move cursor to the end
[[keyboard.bindings]]
chars = "\u001BOF"
key = "Right"
mode = "AppCursor"
mods = "Command"

# delete line
[[keyboard.bindings]]
chars = "\u0015"
key = "Back"
mods = "Command"

# Shared with Ghostty and kitty: Shift/Ctrl+Insert paste/copy,
# and Shift+Return / Alt+Shift+Return as CSI-u so TUIs and tmux can tell them apart.
[[keyboard.bindings]]
action = "Paste"
key = "Insert"
mods = "Shift"

[[keyboard.bindings]]
action = "Copy"
key = "Insert"
mods = "Control"

[[keyboard.bindings]]
chars = "\u001B[13;2u"
key = "Return"
mods = "Shift"

[[keyboard.bindings]]
chars = "\u001B[13;4u"
key = "Return"
mods = "Alt|Shift"

[mouse]
hide_when_typing = true

[selection]
save_to_clipboard = true
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"

[window]
decorations = "none"
dynamic_padding = false
dynamic_title = true

[window.dimensions]
columns = 260
lines = 55

[window.padding]
x = 14
y = 14

[scrolling]
history = 100000
multiplier = 3

[general]
live_config_reload = true

# Theme colors, generated by `theme-switcher set <name>`, and the font family and
# size, generated by `font-switcher`. Imports load before this file, so nothing
# here may set colors or a font family or size.
import = [
  "~/.local/state/theme-switcher/current/theme/alacritty.toml",
  "~/.local/state/font-switcher/current/alacritty.toml"
]

[terminal]
osc52 = "CopyPaste"
shell = "@BREW_PREFIX@/bin/tmux"
