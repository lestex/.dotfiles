# Theme colors, generated by `theme-switcher set <name>`. kitty expands
# environment variables in include paths but does not document ~, so use ${HOME}.
include ${HOME}/.local/state/theme-switcher/current/theme/kitty.conf

# Font family, generated by `font-switcher set <family>`.
include ${HOME}/.local/state/font-switcher/current/kitty.conf

font_size        16.0

window_padding_width 10
hide_window_decorations yes

# @BREW_PREFIX@ is substituted by scripts/mac-setup on install, as for Ghostty:
# a GUI launch inherits no shell PATH and the Homebrew prefix differs by arch.
shell @BREW_PREFIX@/bin/tmux
