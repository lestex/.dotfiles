# Theme colors, generated by `theme-switcher set <name>`. kitty expands
# environment variables in include paths but does not document ~, so use ${HOME}.
# Nothing below may set colors, or it would override the theme.
include ${HOME}/.local/state/theme-switcher/current/theme/kitty.conf

# Font family and size, generated by `font-switcher set <family>` / `size <points>`.
# Bold and italic faces are picked from that family automatically.
include ${HOME}/.local/state/font-switcher/current/kitty.conf

# Defaults below are shared with Ghostty and Alacritty.

# Window
window_padding_width 14
hide_window_decorations yes
confirm_os_window_close 0

# Cursor; shell integration must not restyle it
cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor
enable_audio_bell no

# Keyboard
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard
# Send Shift+Enter as CSI-u so TUIs can distinguish it from Enter.
map shift+enter send_text all \e[13;2u
# Legacy encoding sends Alt+Shift+Enter the same as Alt+Enter; send CSI-u so tmux can match M-S-Enter.
map alt+shift+enter send_text all \e[13;4u

# Tab bar
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}
active_tab_font_style bold
inactive_tab_font_style normal

# Personal settings, kept from the previous kitty config

symbol_map U+F0001-U+F1af0 Hack Nerd Font
symbol_map U+F8FF,U+100000-U+1018C7 SF Pro

window_margin_width 4
remember_window_size no

macos_quit_when_last_window_closed no
macos_colorspace default
macos_show_window_title_in window
macos_titlebar_color system

repaint_delay 8
input_delay 1
resize_debounce_time 0.001

map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9
map cmd+0 goto_tab 10

map cmd+t launch --type=tab --cwd=current
map cmd+n launch --type=os-window --cwd=current
